apiVersion: v1
kind: Pod
metadata:
  name: mc-pod
spec:
  volumes:
    - name: shared-volume
      emptyDir: {}

  containers:
    - name: mc-pod-1
      image: nginx:1-alpine
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: shared-volume
          mountPath: /var/log/shared

    - name: mc-pod-2
      image: busybox:1
      command: ["/bin/sh", "-c"]
      args:
        - while true; do date >> /var/log/shared/date.log; sleep 1; done
      volumeMounts:
        - name: shared-volume
          mountPath: /var/log/shared

    - name: mc-pod-3
      image: busybox:1
      command: ["/bin/sh", "-c"]
      args:
        - tail -f /var/log/shared/date.log
      volumeMounts:
        - name: shared-volume
          mountPath: /var/log/shared



