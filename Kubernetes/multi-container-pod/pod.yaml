apiVersion: v1 
kind: Pod 
metadata: 
  name: multi-container-pod
  namespace: dev 
spec: 
  containers: 
  - name: container-1
    image:  
    volueMounts:
    - name: log-volume
      mountPath: /var/log/app1
  - name: container-2
    image: 
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app2
  volumes:
  - name: log-volume
    emptyDir: {}  #Shared empty directory volume for both containers to write logs. It will be deleted when the pod is deleted.
